<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线OJ-题目列表</title>
</head>
<body>
    <table>
        <tr>        
            <th>标号</th>
            <th>标题</th>
            <th>难度</th>
        </tr>  
        {{#question__list}}     
        <tr>
            <td>{{number}}</td>
            <td><a href="../questions/{{number}}">{{title}}</a></td>
            <td>{{star}}</td>
        </tr>
        {{/question__list}}     
    </table>
</body>
</html>
